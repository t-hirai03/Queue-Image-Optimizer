name: WordPress Coding Standards

on:
  pull_request:
    branches: [ main ]

jobs:
  wpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install dependencies
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev squizlabs/php_codesniffer:^3.0
          composer global require --dev dealerdirect/phpcodesniffer-composer-installer
          composer global require --dev wp-coding-standards/wpcs

      - name: Run WPCS
        run: |
          ~/.composer/vendor/bin/phpcs . \
            --standard=WordPress-Extra \
            --extensions=php \
            --ignore=vendor/,node_modules/,tests/ \
            --exclude=WordPress.Files.FileName,WordPress.PHP.YodaConditions,WordPress.DB.DirectDatabaseQuery,WordPress.DB.PreparedSQL,Universal.Files.SeparateFunctionsFromOO \
            --report=checkstyle \
            -s | cs2pr
